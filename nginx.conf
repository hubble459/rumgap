worker_processes 1;

events {
	worker_connections 1024;
}

http {
	resolver 10.89.1.1 valid=10s ipv6=off;
	resolver_timeout 2s;

	server {
		listen 8003;
		http2 on;
		server_name api.manga.quentincorreia.nl;

		location / {
			set $api grpc://rumgap:8000;
			grpc_pass $api;
		}
	}

	server {
		listen 5909 ssl;
		http2 on;
		server_name api.manga.quentincorreia.nl;

		ssl_certificate     /etc/nginx/certs/api.manga.quentincorreia.nl.pem;
		ssl_certificate_key /etc/nginx/certs/api.manga.quentincorreia.nl.key;

		location / {
			set $api grpc://rumgap:8000;
			grpc_pass $api;
		}
	}

	server {
		listen 8003;
		http2 on;
		server_name images.manga.quentincorreia.nl;

		location / {
			set $images http://rumgap:8001;
			proxy_pass $images;
		}
	}

	server {
		listen 8003;
		http2 on;
		server_name manga.quentincorreia.nl;

		add_header Cross-Origin-Opener-Policy same-origin always;
		add_header Cross-Origin-Embedder-Policy require-corp always;

		location / {
			set $web http://web:8080;
			proxy_pass $web;
		}
	}
}
