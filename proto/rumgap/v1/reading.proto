syntax = "proto3";
package rumgap.v1;

message ReadingPostRequest {
    int32 manga_id = 1;
}

message ReadingPatchRequest {
    int32 manga_id = 1;
    int32 progress = 2;
    // If set, `progress`/`last_canonical_chapter_id` are derived from this chapter's
    // canonical chapter instead of trusting the raw `progress` int directly.
    optional int32 chapter_id = 3;
}

message UpdateChapterOffsetRequest {
    int32 chapter_id = 1;
    int32 pixels = 2;
    int32 page = 3;
    optional float fraction = 4;
}

message GetCrossSourceOffsetRequest {
    int32 canonical_chapter_id = 1;
}

message DeleteReadingRequest {
    int32 manga_id = 1;
}

message CrossSourceOffsetReply {
    // Most recent fraction recorded across any chapter sharing this canonical_chapter_id.
    optional float fraction = 1;
}
