syntax = "proto3";
package rumgap.v1;

message ReadingPostRequest {
    int32 manga_id = 1;
}

message ReadingPatchRequest {
    int32 manga_id = 1;
    // Where the user is. Progress is a rank among the manga's canonical chapters.
    oneof position {
        // The canonical chapter read up to; progress becomes its rank.
        int32 canonical_chapter_id = 4;
        // A raw rank, for when no chapter is known.
        int32 progress = 2;
        // A chapter of one of the manga's sources, resolved to its canonical chapter.
        // Kept for older clients; send `canonical_chapter_id` instead.
        int32 chapter_id = 3 [deprecated = true];
    }
}

message UpdateChapterOffsetRequest {
    int32 chapter_id = 1;
    int32 pixels = 2;
    int32 page = 3;
    optional float fraction = 4;
}

message GetCrossSourceOffsetRequest {
    int32 canonical_chapter_id = 1;
}

message DeleteReadingRequest {
    int32 manga_id = 1;
}

message CrossSourceOffsetReply {
    // Most recent fraction recorded across any chapter sharing this canonical_chapter_id.
    optional float fraction = 1;
}
