syntax = "proto3";

package rumgap.v1;

import "google/protobuf/any.proto";

import "rumgap/v1/user.proto";
import "rumgap/v1/friend.proto";
import "rumgap/v1/manga.proto";
import "rumgap/v1/chapter.proto";
import "rumgap/v1/reading.proto";
import "rumgap/v1/search.proto";
import "rumgap/v1/paginate.proto";
import "rumgap/v1/meta.proto";

service User {
    rpc Register (UserRegisterRequest) returns (UserTokenReply);
    rpc Login (UserRequest) returns (UserTokenReply);
    rpc Get (Id) returns (UserFullReply);
    rpc Index (PaginateQuery) returns (UsersReply);
    rpc Me (Empty) returns (UserFullReply);
    rpc Update (UserUpdateRequest) returns (UserFullReply);
    rpc AddDeviceToken (DeviceTokenRequest) returns (Empty);
    rpc RemoveDeviceToken (DeviceTokenRequest) returns (Empty);
}

service Friend {
    rpc Follow (FriendRequest) returns (UserFullReply);
    rpc Unfollow (FriendRequest) returns (UserFullReply);
    rpc Following (PaginateQuery) returns (UsersReply);
    rpc Followers (PaginateQuery) returns (UsersReply);
}

service Manga {
    rpc Create (MangaRequest) returns (MangaReply);
    rpc CreateMany (MangasRequest) returns (stream MangaReply);
    rpc Get (Id) returns (MangaReply);
    rpc Update (Id) returns (MangaReply);
    rpc Index (PaginateSearchQuery) returns (MangasReply);
    rpc FindOrCreate (MangaRequest) returns (MangaReply);
    rpc Similar (Id) returns (MangasReply);
}

service Chapter {
    rpc Get (ChapterRequest) returns (ChapterReply);
    rpc Index (PaginateChapterQuery) returns (ChaptersReply);
    // Id = chapter_id. Never blocks on downloads -- ensures `chapter_image`
    // rows exist and returns deterministic local image-server URLs; the
    // actual download happens lazily on first real request to that URL.
    rpc Images (Id) returns (ImagesReply);
    // Id = chapter_id. Manual-only force-refresh: deletes this chapter's
    // existing `chapter_image` rows (and their stored bytes) and re-scrapes
    // from scratch. For the handful of sites that briefly serve a
    // placeholder/troll image right after a chapter is scraped.
    rpc RefreshImages (Id) returns (ImagesReply);
    // Id = manga_source_id. Kicks off (or resumes) a throttled background
    // walk that downloads every not-yet-`done` page of every chapter of
    // that source.
    //
    // Deviation from the plan: the plan describes this as
    // `MangaSource.BackfillImages` on `manga.proto`'s (Phase-1-introduced)
    // `MangaSourceReply`. That message doesn't exist in this worktree (it's
    // owned by the parallel Phase 1 branch), so it's defined here instead,
    // scoped to a plain `manga_source_id` int32 rather than a message this
    // branch doesn't own -- see the Phase 2 implementation report for
    // details on folding it into `MangaSourceReply` after the two branches
    // merge. Until Phase 1 lands, `manga_source_id` is resolved against
    // `manga.id` (today's 1:1 manga<->source shape).
    rpc BackfillImages (Id) returns (Empty);
    // Id = manga_source_id (see BackfillImages). Cheap `GROUP BY status`
    // count, meant to be polled on the client's own schedule -- no
    // long-lived streaming RPC for a job that can run for hours.
    rpc GetBackfillStatus (Id) returns (BackfillStatusReply);
}

service Reading {
    rpc Update (ReadingPatchRequest) returns (MangaReply);
    rpc Create (ReadingPostRequest) returns (MangaReply);
    rpc Delete (Id) returns (Empty);
    rpc UpdateChapterOffset (UpdateChapterOffsetRequest) returns (Empty);
}

service Search {
    rpc Manga (SearchRequest) returns (SearchReply);
}

service Meta {
    rpc Hostnames (MetaHostnamesRequest) returns (MetaReply);
    rpc Genres (MetaGenresRequest) returns (MetaReply);
    rpc Stats (Empty) returns (StatsReply);
}

message Id {
    int32 id = 1;
}

message Empty {
}

message DetailedError {
    int32 status = 1;
    string message = 2;
    repeated google.protobuf.Any details = 3;
}