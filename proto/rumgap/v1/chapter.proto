syntax = "proto3";
package rumgap.v1;

import "rumgap/v1/paginate.proto";

message ChapterRequest {
    int32 manga_id = 1;
    int32 index = 2;
}

message ChapterOffset {
    int32 pixels = 1;
    int32 page = 2;
}

message ChapterReply {
    int32 id = 1;
    int32 manga_id = 2;
    string url = 3;
    string title = 4;
    float number = 5;
    int64 index = 6;
    optional int64 posted = 7;
    optional ChapterOffset offset = 8;
    int64 created_at = 9;
    int64 updated_at = 10;
}

message ChaptersReply {
    PaginateReply pagination = 1;
    repeated ChapterReply items = 2;
}

message ImagesReply {
    repeated string items = 1;
}

message PaginateChapterQuery {
    int32 id = 1;
    optional PaginateQuery paginate_query = 2;
    optional bool reversed = 3;
}

// Progress ledger for an in-flight or completed `BackfillImages` walk.
// `images_total` is the count of `chapter_image` rows that exist so far for
// the source (rows are created lazily per-chapter as the walk progresses, so
// this grows during a backfill rather than being known up front).
message BackfillStatusReply {
    int32 images_downloaded = 1;
    int32 images_total = 2;
}