syntax = "proto3";
package rumgap.v1;

import "rumgap/v1/paginate.proto";

message MangaRequest {
    string url = 1;
}

message MangasRequest {
    repeated string urls = 1;
}

message MangaSourceReply {
    int32 id = 1;
    string url = 2;
    string hostname = 3;
    string language = 4;
    bool is_primary = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
}

// Progress ledger for an in-flight or completed `BackfillImages` walk.
// `images_total` is the count of `chapter_image` rows that exist so far for
// the source (rows are created lazily per-chapter as the walk progresses, so
// this grows during a backfill rather than being known up front).
message BackfillStatusReply {
    int32 images_downloaded = 1;
    int32 images_total = 2;
}

message MangaReply {
    int32 id = 1;
    string title = 3;
    string description = 4;
    optional string cover = 5;
    bool is_ongoing = 6;
    repeated string genres = 7;
    repeated string authors = 8;
    repeated string alt_titles = 9;
    // Computed from the primary source only.
    int64 count_chapters = 10;
    optional int64 next = 11;
    optional int64 last = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
    optional int32 reading_progress = 15;
    string status = 16;
    repeated MangaSourceReply sources = 17;
    // The canonical ordinal of the last-read chapter (whichever source it was read on) -
    // comparable across sources, unlike reading_progress (a rank among canonical slots,
    // which can exceed any single source's own chapter count once bonus/unlinked chapters
    // exist). Compare against ChapterReply.ordinal to tell whether a specific chapter has
    // been read, regardless of which source it's from.
    optional double progress_ordinal = 18;
}

message MangasReply {
    PaginateReply pagination = 1;
    repeated MangaReply items = 2;
}

message AddSourceRequest {
    int32 manga_id = 1;
    string url = 2;
}

message RemoveSourceRequest {
    int32 manga_source_id = 1;
}

message SetPrimarySourceRequest {
    int32 manga_source_id = 1;
}
