syntax = "proto3";
package rumgap.v1;

import "rumgap/v1/paginate.proto";

message MangaRequest {
    string url = 1;
}

message MangasRequest {
    repeated string urls = 1;
}

message MangaSourceReply {
    int32 id = 1;
    string url = 2;
    string hostname = 3;
    string language = 4;
    bool is_primary = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
    // Every chapter of this source has all of its pages downloaded locally, so it can
    // still be read if the site goes away. False for a source with no chapters.
    bool fully_stored = 8;
    // This source's own details, as its last scrape found them.
    string title = 9;
    string description = 10;
    optional string cover = 11;
    repeated string genres = 12;
    repeated string authors = 13;
    repeated string alt_titles = 14;
    string status = 15;
    bool is_ongoing = 16;
    int64 count_chapters = 17;
    // Newest chapter's posted date.
    optional int64 last = 18;
    // When the details above were last scraped. Unset until this source has been scraped
    // since sources got their own details; until then they're a copy of the primary's.
    optional int64 details_updated_at = 19;
}

// Progress ledger for an in-flight or completed `BackfillImages` walk.
// `images_total` is the count of `chapter_image` rows that exist so far for
// the source (rows are created lazily per-chapter as the walk progresses, so
// this grows during a backfill rather than being known up front).
message BackfillStatusReply {
    int32 images_downloaded = 1;
    int32 images_total = 2;
}

message MangaReply {
    int32 id = 1;
    string title = 3;
    string description = 4;
    optional string cover = 5;
    bool is_ongoing = 6;
    repeated string genres = 7;
    repeated string authors = 8;
    repeated string alt_titles = 9;
    // The details, chapter counts and dates come from `selected_source_id`.
    int64 count_chapters = 10;
    optional int64 next = 11;
    optional int64 last = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
    optional int32 reading_progress = 15;
    string status = 16;
    repeated MangaSourceReply sources = 17;
    // The canonical ordinal of the last-read chapter (whichever source it was read on) -
    // comparable across sources, unlike reading_progress (a rank among canonical slots,
    // which can exceed any single source's own chapter count once bonus/unlinked chapters
    // exist). Compare against ChapterReply.ordinal to tell whether a specific chapter has
    // been read, regardless of which source it's from.
    optional double progress_ordinal = 18;
    // The source this user sees for this manga: the one they last picked (SelectSource),
    // otherwise their first preferred hostname, otherwise the primary.
    int32 selected_source_id = 19;
    // 18+. Hidden outside the reading list for users who turned off show_nsfw.
    bool nsfw = 20;
}

message SelectSourceRequest {
    int32 manga_source_id = 1;
}

message MangasReply {
    PaginateReply pagination = 1;
    repeated MangaReply items = 2;
}

message AddSourceRequest {
    int32 manga_id = 1;
    string url = 2;
}

message RemoveSourceRequest {
    int32 manga_source_id = 1;
}

message SetPrimarySourceRequest {
    int32 manga_source_id = 1;
}

message MergeMangaRequest {
    // Absorbed into target_manga_id, then deleted.
    int32 source_manga_id = 1;
    // Survives the merge.
    int32 target_manga_id = 2;
}

message MoveSourceRequest {
    int32 manga_source_id = 1;
    int32 target_manga_id = 2;
}

message DeleteMangaRequest {
    int32 id = 1;
}

message GetMangaRequest {
    int32 id = 1;
}

message SimilarMangaRequest {
    int32 id = 1;
}

message DismissMangaRequest {
    int32 id = 1;
}

message SetNsfwRequest {
    int32 manga_id = 1;
    bool nsfw = 2;
}

message BackfillImagesRequest {
    int32 manga_source_id = 1;
}

message GetBackfillStatusRequest {
    int32 manga_source_id = 1;
}
