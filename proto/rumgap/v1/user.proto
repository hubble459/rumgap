syntax = "proto3";
package rumgap.v1;

import "rumgap/v1/paginate.proto";

message UserRegisterRequest {
    string username = 1;
    string password = 2;
    string email = 3;
}

message DeviceTokenRequest {
    string token = 1;
}

message GetUserRequest {
    int32 id = 1;
}

message UserRequest {
    string password = 1;
    oneof identifier {
        string username = 2;
        string email = 3;
    }
}

message UserUpdateRequest {
    optional string password = 1;
    optional string username = 2;
    optional string email = 3;
    repeated string preferred_hostnames = 4;
    repeated string device_ids = 5;
    // Required when changing password
    optional string current_password = 6;
}

message UserReply {
    int32 id = 1;
    string username = 2;
    string email = 3;
    int32 permissions = 4;
    repeated string preferred_hostnames = 5;
    repeated string device_ids = 6;
    int64 created_at = 7;
    int64 updated_at = 8;
}

message UserFullReply {
    int32 id = 1;
    string username = 2;
    string email = 3;
    int32 permissions = 4;
    repeated string preferred_hostnames = 5;
    repeated string device_ids = 6;
    int64 count_following = 7;
    int64 count_followers = 8;
    int64 created_at = 9;
    int64 updated_at = 10;
}

message UserTokenReply {
    UserFullReply user = 1;
    string token = 2;
}

message UsersReply {
    PaginateReply pagination = 1;
    repeated UserReply items = 2;
}
message SessionReply {
    string id = 1;
    optional string user_agent = 2;
    int64 created_at = 3;
    int64 last_used_at = 4;
    int64 expires_at = 5;
    // The session this request was made with
    bool current = 6;
}

message SessionsReply {
    repeated SessionReply items = 1;
}

message RevokeSessionRequest {
    string id = 1;
}
