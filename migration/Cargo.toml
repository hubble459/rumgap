[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1.12", features = ["attributes", "tokio1"] }
sea-orm-migration = { version = "2", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
# Keeps `SERIAL` columns for auto_increment() rather than sea-query 2.0's identity columns
# (`GENERATED BY DEFAULT AS IDENTITY`), matching the existing schema.
sea-query = { version = "1", features = ["option-postgres-use-serial"] }
