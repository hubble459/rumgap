[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1.12", features = ["attributes", "tokio1"] }
sea-orm-migration = { version = "2", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
# Preserves legacy `SERIAL` column generation for auto_increment() instead of
# 2.0's new default (`GENERATED BY DEFAULT AS IDENTITY`), so existing schema stays unchanged.
sea-query = { version = "1", features = ["option-postgres-use-serial"] }
